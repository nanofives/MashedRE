# Parity capture recipes -- area -> how to reproduce a capture pair + which diff scores it.
#
# These are DOCUMENTATION strings, not executed by parity_scoreboard.py (parse-only design).
# A round runs capture_a / capture_b / diff BY HAND, then feeds the diff's stdout to:
#   py -3.12 re/tools/parity_scoreboard.py record --recipe <id> --round <N> --from out.txt
#
# Fields per [recipe]:
#   area      canonical subsystem this parity check belongs to (ledger key)
#   kind      "drawlist" (drawlist_diff.py, exit0=GREEN) or "imgdiff" (imgdiff.py, numeric)
#   blocker   non-empty => this recipe CANNOT be captured yet; scoreboard records BLOCKED, not RED
#   capture_a original-side capture (the reference)
#   capture_b standalone-side capture
#   diff      the exact diff command (flags matter: they are the "known asymmetries" from parity_tooling.md)
#   reference free-text: what a GREEN means here, and any pose/same-frame caveat
#
# Placeholders in <angle brackets> are filled at run time (PID, frame range, track sel).
# Flag rationale lives in re/analysis/parity_tooling.md -- do not drop --scale-b/--exclude-tex silently.

[render.race_first_frame]
area = "render"
kind = "drawlist"
blocker = ""
capture_a = "py -3.12 re/frida/race_draw_burst.py --pid <ORIG_PID> --frames <K>  # original, MASHED_ORIG_BBDUMP channel"
capture_b = "MASHED_DBG_DRAWSTREAM=<N:M> MASHED_GOTO=race MASHED_TRACK_SEL=<track> mashed_re.exe  -> log/drawstream_re.json"
diff = "py -3.12 re/tools/drawlist_diff.py <A.json> log/drawstream_re.json --scale-b 0.8 --exclude-tex 9 --rotate-a 0x42e65a --tol-anim 4"
reference = "GREEN = every Im2D draw matched. Race camera rolls +/-30deg on a 1024-tick sine ([[race-camera-rolls-30deg-sine]]); a single-frame capture must transplant a same-frame 12-float basis or it measures the sway, not a defect. Wait for process exit before reading the BMP ([[race-capture-wait-for-exit]])."

[render.race_first_frame_arctic]
area = "render"
kind = "drawlist"
blocker = "T-ARCTIC: no pose-matched original Arctic frame; mode-3 nav unimplemented in race_draw_burst.py. Per-track parity on Arctic cannot close until this is fixed (re/HARNESS_BACKLOG.md)."
capture_a = "(blocked) race_draw_burst.py cannot reach the Arctic mode-3 pose"
capture_b = "MASHED_DBG_DRAWSTREAM=<N:M> MASHED_GOTO=race MASHED_TRACK_SEL=arctic mashed_re.exe"
diff = "py -3.12 re/tools/drawlist_diff.py <A.json> log/drawstream_re.json --scale-b 0.8 --exclude-tex 9"
reference = "The terrain-ambient overbrighten defect ([[terrain-ambient-fill-overbrightens]]) and the water fold ([[geomlight-darkens-arctic-sea]]) both surface here. BLOCKED until T-ARCTIC clears."

[render.city_road]
area = "render"
kind = "imgdiff"
blocker = ""
capture_a = "scripts/capture_window.ps1 <ORIG_PID>  # City track first frame, plain screenshot renders white -- use the helper"
capture_b = "scripts/capture_window.ps1 <RE_PID>"
diff = "py -3.12 re/tools/imgdiff.py <orig.png> <re.png> --grid 8x6 --threshold 16"
reference = "Targets the City black-road defect. imgdiff numeric backstop; watch the bottom grid rows (road band). No --fail-mean => scoreboard records the mean, verdict=measured."

[render.dump_sky]
area = "render"
kind = "imgdiff"
blocker = ""
capture_a = "scripts/capture_window.ps1 <ORIG_PID>  # Dump track, sky band"
capture_b = "scripts/capture_window.ps1 <RE_PID>"
diff = "py -3.12 re/tools/imgdiff.py <orig.png> <re.png> --grid 8x6 --threshold 16"
reference = "Targets the Dump white-sky defect. Watch the top grid rows (sky band)."

[frontend.scr1]
area = "frontend"
kind = "drawlist"
blocker = ""
capture_a = "py -3.12 re/frida/menu_draw_burst.py --screen 1 --frames <K>"
capture_b = "MASHED_DBG_DRAWSTREAM=<N:M> MASHED_GOTO=1 mashed_re.exe -> log/drawstream_re.json"
diff = "py -3.12 re/tools/drawlist_diff.py <A.json> log/drawstream_re.json --scale-b 0.8 --exclude-tex 9"
reference = "Baseline GREEN 118/118 (settled scr1). This is the reference recipe -- a regression here means a frontend round broke composition."
